name: 缺陷报告
description: 提交可复现的门禁重放或来源记录问题
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: '请勿粘贴 Key、真实业务归档或完整 profile。安全问题按 SECURITY.md 处理。'
  - type: input
    id: versions
    attributes:
      label: 插件、Node 和 DSH 版本
      description: 同时说明操作系统及宿主载体。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤和构造输入
      description: 说明环境变量是否设置；使用脱敏或构造案例。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏依据
      description: 包含 PASS／FAIL／REVIEW、退出码和关键错误；没有运行时请明确说明。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 已移除凭据、个人路径和未授权业务内容
          required: true
