# 若 npm Trusted Publisher 只允许 npm stage publish，须将下方发布命令换为
# npm stage publish；直接运行 npm publish 会被 403 拒绝。
name: 发布 npm 包

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取源码和 tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 核对 tag 与版本
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_TYPE !== 'tag' || process.env.GITHUB_REF_NAME !== `v${version}`) {
            console.error(`发布已阻止：必须在 tag v${version} 上执行，分支或版本不一致均不发布。`);
            process.exit(1);
          }
          NODE
      - name: 确认无 private 字段
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (Object.hasOwn(pkg, 'private')) {
            console.error('发布已阻止：package.json 仍含 private 字段，须删除该字段后重新审阅。');
            process.exit(1);
          }
          NODE
      - name: 运行测试
        run: npm test
      - name: 通过 OIDC 发布
        run: npm publish --provenance --access public --tag latest
        env:
          VERISCOPE_RELEASE: "1"
